name: Deploy Monitoring Tool

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 1. Build & Push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile 
          push: true
          tags: allanbinga/monitoring-tool-backend:latest

      # 2. Build & Push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: allanbinga/monitoring-tool-frontend:latest
          build-args: |
            VITE_BACKEND_ENDPOINT=https://api.monitor.skirill.org/system-monitor/v1

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            # 1. Navigate directly to your manual setup folder
            cd ${{ secrets.PROJECT_PATH }}

            # 2. Pull down the new layers that were just pushed to Docker Hub
            echo "Pulling newest images..."
            docker compose pull

            # 3. Recreate the containers seamlessly using the new image layers
            echo "Updating containers..."
            docker compose up -d --force-recreate

            # 4. Remove older, unused image layers to keep your VPS disk clean
            echo "Pruning dangling images..."
            docker image prune -f

            echo "Deployment successful!"
          EOF
